name: Arsenal Digital CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Arsenal_Digital/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Arsenal_Digital/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run PSScriptAnalyzer
      shell: pwsh
      run: |
        Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
        $results = Invoke-ScriptAnalyzer -Path ./Arsenal_Digital/scripts/*.ps1 -Recurse
        if ($results) {
          $results | Format-Table
          $errors = $results | Where-Object { $_.Severity -eq 'Error' }
          if ($errors) {
            Write-Error "PSScriptAnalyzer found errors."
            exit 1
          }
        } else {
          Write-Host "PSScriptAnalyzer passed successfully."
        }

    - name: Verify Arsenal Integrity and Validation
      shell: pwsh
      run: |
        ./Arsenal_Digital/scripts/Validate-Arsenal.ps1
